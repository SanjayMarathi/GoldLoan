# docker compose up -d db        → just PostgreSQL for local development (npm run dev)
# docker compose up --build      → the whole app (API + built web) on http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gold
      POSTGRES_PASSWORD: gold
      POSTGRES_DB: goldloan
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gold -d goldloan']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://gold:gold@db:5432/goldloan
      WEB_ORIGIN: http://localhost:4000
      # Optional – without a key the deterministic offline assistant is used.
      # Put keys in a local .env file (never commit it); compose substitutes them here.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}

volumes:
  pgdata:
